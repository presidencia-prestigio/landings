<style>
/* Marca Prestigio · diseño claro a propósito (un solo tema, colores explícitos).
   Mobile-first: una pregunta por pantalla, botón principal al alcance del pulgar. */
:root{
  --teal:#0D3B47; --teal-2:#164E5C; --lime:#A6BC2E; --lime-soft:#EEF3D6;
  --paper:#F4F7F7; --surface:#FFFFFF; --ink:#13282E; --muted:#5B6E73; --line:#D3DEE0;
  --error:#B3261E; --error-soft:#FCEDEC;
  --f-display:"Poppins", ui-sans-serif, system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --dur:.38s; --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
.shell{min-height:100%;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.main-in{width:100%;max-width:640px;margin:0 auto;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.top img{height:34px;width:auto;display:block}
.step{font:600 13px var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.progress{height:4px;background:var(--line)}
.progress span{display:block;height:100%;width:0;background:var(--lime);transition:width var(--dur) var(--ease)}
.banner{background:var(--teal);color:#fff;font:600 14px var(--f-display);text-align:center;padding:10px 16px}
main{flex:1;display:flex}
.main-in{display:flex;flex-direction:column;padding-block:32px 28px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.18;color:var(--teal)}
h1{font-size:clamp(28px,7.5vw,40px);font-weight:700}
h2{font-size:clamp(23px,6vw,30px);font-weight:600}
.kicker{font:600 12.5px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin-bottom:12px;filter:brightness(.8)}
.lead{color:var(--muted);margin:14px 0 0;max-width:34em}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:15.5px}
.meta b{color:var(--ink);font-weight:600}
.screen{display:flex;flex-direction:column;gap:22px;flex:1}
.q-num{font:600 14px var(--f-display);color:var(--muted);display:flex;align-items:center;gap:8px}
.q-num i{display:inline-block;width:18px;height:2px;background:var(--lime)}
.help{color:var(--muted);font-size:16px;margin-top:-10px}
input[type=text],input[type=email],input[type=tel],textarea{
  width:100%;font:inherit;font-size:20px;color:var(--ink);background:var(--surface);
  border:2px solid var(--line);border-radius:12px;padding:14px 16px;outline:none;
  transition:border-color .2s}
textarea{min-height:140px;resize:vertical;line-height:1.45}
input:focus,textarea:focus{border-color:var(--teal)}
.field.invalid input,.field.invalid textarea{border-color:var(--error)}
.err{color:var(--error);font-size:15.5px;font-weight:600;min-height:1.4em}
.count{color:var(--muted);font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums;margin-top:6px}
.actions{margin-top:auto;display:flex;gap:10px;align-items:center;padding-top:18px}
button{font:600 17px var(--f-display);border-radius:12px;padding:15px 22px;cursor:pointer;border:2px solid transparent;transition:transform .15s,background .2s}
button:active{transform:scale(.98)}
.btn-main{background:var(--teal);color:#fff;flex:1}
.btn-main:hover{background:var(--teal-2)}
.btn-back{background:transparent;color:var(--teal);border-color:var(--line);padding-inline:18px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
button[disabled]{opacity:.6;cursor:default}
.hint{color:var(--muted);font-size:13.5px;text-align:center;margin-top:10px}
.alert{background:var(--error-soft);border:1px solid var(--error);border-radius:12px;padding:14px 16px;font-size:16px}
.thanks-mark{width:64px;height:64px;border-radius:50%;background:var(--lime-soft);display:grid;place-items:center}
.thanks-mark svg{width:30px;height:30px;color:var(--teal)}
.nojs{background:var(--surface);border:2px solid var(--lime);border-radius:12px;padding:16px 18px;margin-top:24px}
.nojs strong{font-family:var(--f-display);color:var(--teal)}
.js .nojs{display:none}
.no-js #app{display:none}
/* honeypot: fuera de la vista y del orden de tabulación */
.hp{position:absolute!important;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}
/* animación de pregunta */
.enter{animation:enter var(--dur) var(--ease) both}
.enter.back{animation-name:enter-back}
@keyframes enter{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes enter-back{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  :root{--dur:0s}
  .enter,.enter.back{animation:none}
  .progress span,button,input,textarea{transition:none}
}
@media (min-width:720px){.main-in{padding-block:64px 48px}}
</style>

    { id: "empresa", tipo: "text", titulo: "¿En qué empresa u organización trabajas?", requerido: false, max: 160, auto: "organization" },
    { id: "respuesta", tipo: "textarea", titulo: "¿Qué te gustaría lograr con nosotros?", ayuda: "Escríbelo con tus palabras.", requerido: true, max: 1500 },
    { id: "comentarios", tipo: "textarea", titulo: "¿Quieres agregar algún comentario?", ayuda: "Opcional.", requerido: false, max: 1000 }
  ];
  /* ================================================= */

  var app = document.getElementById("app");
  var intro = document.getElementById("intro-static");
  var bar = document.getElementById("bar");
  var stepEl = document.getElementById("step");
  var datos = {};
  var i = -1;              // -1 = bienvenida
  var cargado = Date.now();
  var enviando = false;

  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]);
    });
    if (text != null) e.textContent = text;
    return e;
  }
  function progreso() {
    var n = PREGUNTAS.length;
    var pct = i < 0 ? 0 : i >= n ? 100 : Math.round((i / n) * 100);
    bar.style.width = pct + "%";
    stepEl.textContent = i >= 0 && i < n ? (i + 1) + " de " + n : "";
  }
  function pantalla(nodo, haciaAtras) {
    app.textContent = "";
    nodo.classList.add("screen", "enter");
    if (haciaAtras) nodo.classList.add("back");
    app.appendChild(nodo);
    progreso();
  }

  function bienvenida() {
    i = -1;
    intro.hidden = true;
    var s = el("section");
    var head = el("div");
    head.appendChild(el("p", { "class": "kicker" }, "Plantilla"));
    head.appendChild(el("h1", null, "Título de la landing"));
    head.appendChild(el("p", { "class": "lead" }, "Una o dos frases que expliquen para qué es este formulario."));
    var meta = el("div", { "class": "meta" });
    var m1 = el("span"); m1.appendChild(el("b", null, PREGUNTAS.length + " preguntas")); meta.appendChild(m1);
    var m2 = el("span"); m2.appendChild(el("b", null, "2 minutos")); m2.appendChild(document.createTextNode(" aprox.")); meta.appendChild(m2);
    head.appendChild(meta);
    s.appendChild(head);
    var act = el("div", { "class": "actions" });
    var b = el("button", { type: "button", "class": "btn-main", id: "empezar" }, "Empezar");
    b.addEventListener("click", function () { ir(0); });
    act.appendChild(b);
    s.appendChild(act);
    pantalla(s);
    b.focus();
  }

  function validar(p, v) {
    v = (v || "").trim();
    if (p.requerido && !v) return "Esta respuesta es necesaria para continuar.";
    if (v.length > p.max) return "Máximo " + p.max + " caracteres.";
    if (v && p.tipo === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return "Revisa el correo: parece incompleto.";
    if (v && p.tipo === "tel") {
      var dig = v.replace(/\D/g, "");
      if (!/^[+\d\s().-]+$/.test(v) || dig.length < 7 || dig.length > 15) return "Escribe solo el número, con indicativo. Ejemplo: +57 300 123 4567";
    }
    return "";
  }

  function ir(n, haciaAtras) {
    i = n;
    var p = PREGUNTAS[i];
    var s = el("form", { novalidate: "" });
    var num = el("div", { "class": "q-num" });
    num.appendChild(el("i"));
    num.appendChild(document.createTextNode("Pregunta " + (i + 1) + (p.requerido ? "" : " · opcional")));
    s.appendChild(num);
    var h = el("h2", null, p.titulo);
    h.id = "t-" + p.id;
    s.appendChild(h);
    if (p.ayuda) s.appendChild(el("p", { "class": "help", id: "a-" + p.id }, p.ayuda));

    var field = el("div", { "class": "field" });
    var input;
    if (p.tipo === "textarea") {
      input = el("textarea", { id: p.id, name: p.id, maxlength: String(p.max), rows: "5" });
    } else {
      input = el("input", { id: p.id, name: p.id, type: p.tipo, maxlength: String(p.max), autocomplete: p.auto || "off" });
      if (p.tipo === "email") input.setAttribute("inputmode", "email");
      if (p.tipo === "tel") input.setAttribute("inputmode", "tel");
      input.setAttribute("enterkeyhint", i === PREGUNTAS.length - 1 ? "send" : "next");
    }
    input.setAttribute("aria-labelledby", "t-" + p.id);
    if (p.ayuda) input.setAttribute("aria-describedby", "a-" + p.id + " e-" + p.id);
    else input.setAttribute("aria-describedby", "e-" + p.id);
    input.value = datos[p.id] || "";
    field.appendChild(input);
    var cnt = null;
    if (p.tipo === "textarea") {
      cnt = el("div", { "class": "count" });
      field.appendChild(cnt);
    }
    var err = el("div", { "class": "err", id: "e-" + p.id, "aria-live": "polite" });
    field.appendChild(err);
    s.appendChild(field);

    function contar() { if (cnt) cnt.textContent = input.value.length + " / " + p.max; }
    contar();
    input.addEventListener("input", function () {
      datos[p.id] = input.value;
      contar();
      if (err.textContent) { err.textContent = ""; field.classList.remove("invalid"); input.removeAttribute("aria-invalid"); }
    });

    var ultima = i === PREGUNTAS.length - 1;
    var act = el("div", { "class": "actions" });
    var back = el("button", { type: "button", "class": "btn-back", "aria-label": "Volver a la pregunta anterior" }, "←");
    back.addEventListener("click", function () { if (i === 0) bienvenida(); else ir(i - 1, true); });
    var next = el("button", { type: "submit", "class": "btn-main" }, ultima ? "Enviar" : "Siguiente");
    act.appendChild(back);
    act.appendChild(next);
    s.appendChild(act);
    if (p.tipo === "textarea") s.appendChild(el("p", { "class": "hint" }, "Ctrl + Enter o ⌘ + Enter para continuar"));

    s.addEventListener("submit", function (e) {
      e.preventDefault();
      var msg = validar(p, input.value);
      if (msg) {
        err.textContent = msg;
        field.classList.add("invalid");
        input.setAttribute("aria-invalid", "true");
        input.focus();
        return;
      }
      datos[p.id] = input.value.trim();
      if (ultima) enviar(next); else ir(i + 1);
    });
    if (p.tipo === "textarea") {
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); s.requestSubmit ? s.requestSubmit() : next.click(); }
      });
    }

    pantalla(s, haciaAtras);
    setTimeout(function () { input.focus({ preventScroll: true }); }, 30);
  }

  function construirFila() {
    var fila = { formulario: CONFIG.formulario, nombre: null, correo: null, telefono: null, respuestas: {} };
    PREGUNTAS.forEach(function (p) {
      var v = (datos[p.id] || "").trim();
      if (p.campo) fila[p.campo] = v || null;
      else if (v) fila.respuestas[p.id] = v;
    });
    return fila;
  }

  function enviar(boton) {
    if (enviando) return;
    var hp = document.getElementById("sitio_web").value;
    var muyRapido = Date.now() - cargado < 4000;
    if (hp || muyRapido) { gracias(); return; }            // bot: se descarta en silencio
    if (!CONFIG.activo) { gracias(true); return; }          // plantilla: no envía

    if (/TU-PROYECTO|REEMPLAZAR/.test(CONFIG.supabaseUrl + CONFIG.publishableKey)) {
      console.error("Landing sin configurar: completa supabaseUrl y publishableKey en CONFIG.");
    }
    enviando = true;
    boton.disabled = true;
    boton.textContent = "Enviando…";
    var prev = app.querySelector(".alert");
    if (prev) prev.remove();

    fetch(CONFIG.supabaseUrl.replace(/\/$/, "") + "/rest/v1/respuestas", {
      method: "POST",
      headers: {
        "apikey": CONFIG.publishableKey,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(construirFila())
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      gracias();
    }).catch(function () {
      enviando = false;
      boton.disabled = false;
      boton.textContent = "Intentar de nuevo";
      var a = el("div", { "class": "alert", role: "alert" },
        "No pudimos enviar tus respuestas. Revisa tu conexión e inténtalo de nuevo. Tus respuestas siguen aquí.");
      boton.closest(".actions").before(a);
    });
  }

  function gracias(esPlantilla) {
    i = PREGUNTAS.length;
    var s = el("section");
    var mark = el("div", { "class": "thanks-mark", "aria-hidden": "true" });
    mark.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    s.appendChild(mark);
    var nombre = (datos.nombre || "").split(" ")[0];
    s.appendChild(el("h1", null, esPlantilla ? "Fin de la plantilla" : "¡Gracias" + (nombre ? ", " + nombre : "") + "!"));
    s.appendChild(el("p", { "class": "lead" }, esPlantilla
      ? "Esta es la plantilla: no envía ni guarda respuestas. Cópiala a una carpeta nueva para crear una landing."
      : "Mensaje de agradecimiento."));
    pantalla(s);
    stepEl.textContent = "";
  }

  bienvenida();
})();
</script>
</body>
</html>
