<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prestigio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D3B47">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Source+Sans+3:wght@400&display=swap">
<style>
  :root{--teal:#0D3B47;--lime:#A6BC2E;--muted:#A9C2C7;color-scheme:dark}
  html,body{height:100%;margin:0}
  body{background:var(--teal);color:#fff;font:18px/1.5 "Source Sans 3",system-ui,sans-serif;display:grid;place-items:center;
    padding:24px max(20px,env(safe-area-inset-left,0px));text-align:center}
  h1{font:600 clamp(26px,6vw,34px)/1.2 "Poppins",system-ui,sans-serif;margin:0 0 10px}
  p{margin:0;color:var(--muted)}
  i{display:block;width:48px;height:3px;background:var(--lime);margin:18px auto 0;border-radius:2px}
</style>
</head>
<body>
  <main>
    <h1>Prestigio</h1>
    <p>Liderando desde el ser</p>
    <i aria-hidden="true"></i>
  </main>
</body>
</html>
